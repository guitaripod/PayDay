name: PayDay
options:
  bundleIdPrefix: com.guitaripod
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  xcodeVersion: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${PAYDAY_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  PayDayCore:
    path: Core/PayDayCore
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  AICredits:
    path: ../../packages/AICredits
  MidgarKit:
    path: ../../packages/MidgarKit

x-midgar-keychain-groups: &midgarKeychainGroups
  - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
  - $(AppIdentifierPrefix)cc.midgarcorp.shared

targets:
  PayDay:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Secrets.example.swift"
      - path: App/Secrets.swift
        optional: true
      - path: Features
      - path: Resources
    dependencies:
      - package: PayDayCore
        product: PayDayCore
      - package: GRDB
      - package: AICredits
        product: AICreditsCore
      - package: AICredits
        product: AICreditsRevenueCat
      - package: AICredits
        product: AICreditsUI
      - package: MidgarKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pay Day
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIRequiredDeviceCapabilities:
          - arm64
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Pay Day lets you pick a logo for your invoices and import a photo of a receipt to draft line items.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.guitaripod.payday
            CFBundleURLSchemes:
              - com.guitaripod.payday
        CADisableMinimumFrameDurationOnPhone: true
        LSApplicationQueriesSchemes:
          - com.guitaripod.embr
          - com.guitaripod.helia
          - com.guitaripod.payday
          - com.guitaripod.pixie
          - com.guitaripod.psybeam
          - com.guitaripod.tailscode
          - com.marcusziade.aotd
          - com.marcusziade.doublekick
          - com.marcusziade.dreameater
          - com.marcusziade.inventory
          - com.marcusziade.knowtheflag
          - com.marcusziade.psywave
          - com.marcusziade.sforesight
          - com.marcusziade.solarbeam
          - com.midgarcorp.flaccy
          - com.midgarcorp.flaccy.mac
          - midgar-01
          - midgar-02
          - midgar-03
          - midgar-04
          - midgar-05
          - midgar-06
          - midgar-07
          - midgar-08
          - midgar-09
    entitlements:
      path: App/PayDay.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        keychain-access-groups: *midgarKeychainGroups
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PAYDAY_BUNDLE_ID}
        PRODUCT_NAME: PayDay
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "PayDay App Store 2026"

  PayDayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PayDayTests
    dependencies:
      - target: PayDay
      - package: PayDayCore
        product: PayDayCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ${PAYDAY_BUNDLE_ID}.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PayDay.app/PayDay
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  PayDay:
    build:
      targets:
        PayDay: all
        PayDayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PayDayTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
